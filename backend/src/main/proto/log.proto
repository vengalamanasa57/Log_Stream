syntax = "proto3";

package logstream;

option java_multiple_files = true;
option java_package = "com.logstream.grpc";
option java_outer_classname = "LogProto";

message LogMessage {
  string id = 1;
  string timestamp = 2;
  string level = 3;
  string service = 4;
  string message = 5;
  int64 response_time_ms = 6;
  string host = 7;
  string trace_id = 8;
}

message IngestResponse {
  bool success = 1;
  string message = 2;
  string log_id = 3;
}

service LogIngestionService {
  rpc SendLog(LogMessage) returns (IngestResponse);
  rpc SendLogs(stream LogMessage) returns (IngestResponse);
}
